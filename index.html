<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Y INDEXACIÓN (GOOGLE DISCOVER READY) -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="description" content="Portal oficial de noticias, análisis académico, política y tendencias de CampusLA.">
  <link rel="canonical" href="https://campuslatinoamerica.edu.co/news">
  
  <title>CampusNews | El Portal de Noticias de CampusLA</title>

  <style>
    :root {
      --primary: #003366; --brand-green: #28a745; --dark: #111827; --white: #ffffff;
    }
    /* Estilos del Modal */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); overflow-y: auto; }
    .modal-content { background: var(--white); margin: 5% auto; padding: 30px; width: 90%; max-width: 800px; border-radius: 8px; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: var(--primary); }
    /* ... (resto de tus estilos institucionales) ... */
  </style>
</head>
<body>

  <!-- ... (Tu Header y Nav igual) ... -->

  <main class="main-container">
    <div id="noticias-container"></div>
  </main>

  <!-- MODAL DE LECTURA (EL POP-UP) -->
  <div id="news-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const noticiasDB = { /* Tus 8 artículos aquí */ };

    function abrirNoticia(id) {
      const item = noticiasDB[id];
      document.getElementById('modal-body').innerHTML = item.content;
      document.getElementById('news-modal').style.display = 'block';
    }

    function cerrarModal() {
      document.getElementById('news-modal').style.display = 'none';
    }

    // Cerrar si hacen clic fuera del modal
    window.onclick = function(event) {
      if (event.target == document.getElementById('news-modal')) cerrarModal();
    }
    
    // ... (Tu función renderizar igual) ...
  </script>
</body>
</html>
